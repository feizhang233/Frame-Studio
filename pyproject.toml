[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame2d"
version = "0.2.0"
description = "2D frame linear-static finite element solver with a FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "PyMySQL>=1.1",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
frame2d-api = "frame2d.api:run"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
